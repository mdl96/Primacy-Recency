<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Gedächtnis-Experiment: Primacy & Recency</title>
    
    <!-- jsPsych Kern-Bibliothek -->
    <script src="https://unpkg.com/jspsych@7.3.4"></script>
    
    <!-- jsPsych Plugins (ohne strikte Versionen für maximale Kompatibilität) -->
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response"></script>
    <script src="https://unpkg.com/@jspsych-contrib/plugin-pipe"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-html-form"></script>
    
    <!-- jsPsych Standard-Styling -->
    <link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet" type="text/css" />
    
    <style>
        .stimulus-text {
            font-size: 48px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <script>
        // 1. jsPsych initialisieren
        const jsPsych = initJsPsych();

        // 2. Timeline und globale Variablen
        const timeline = [];
        const KEYS = { old: 'f', new: 'j' };

        // 3. Stimulus-Material (30 Wörter)
        const wordPool = [
            "Apfel", "Baum", "Haus", "Auto", "Hund", 
            "Katze", "Tisch", "Stuhl", "Vogel", "Fisch", 
            "Sonne", "Mond", "Stern", "Wolke", "Berg",
            "Fluss", "Wald", "Wiese", "Blume", "Buch",
            "Stift", "Schuh", "Hut", "Jacke", "Hose",
            "Brot", "Käse", "Milch", "Wasser", "Saft"
        ];

        // 4. Randomisierung und Aufteilung (15 Targets, 15 Distraktoren)
        const shuffledPool = jsPsych.randomization.shuffle(wordPool);
        const targetWords = shuffledPool.slice(0, 15);
        const distractorWords = shuffledPool.slice(15, 30);

        // 5. Trials für Lernphase und Testphase vorbereiten
        const studyTrials = targetWords.map((word, index) => {
            return { word: word, position: index + 1 };
        });

        let testTrials = [];
        targetWords.forEach((word, index) => {
            testTrials.push({
                word: word, condition: 'old', correct_response: KEYS.old, study_position: index + 1
            });
        });
        distractorWords.forEach((word) => {
            testTrials.push({
                word: word, condition: 'new', correct_response: KEYS.new, study_position: 'N/A'
            });
        });
        testTrials = jsPsych.randomization.shuffle(testTrials);

        // 6. Trial Sequences (Fixation, Study, Test)
        const fixation = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: '<div style="font-size:60px; color:grey;">+</div>',
            choices: "NO_KEYS",
            trial_duration: 500,
            data: { task: 'fixation' }
        };

        const study_stimulus = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: function() { return '<div class="stimulus-text">' + jsPsych.timelineVariable('word') + '</div>'; },
            choices: "NO_KEYS",
            trial_duration: 2000,
            post_trial_gap: 500,
            data: { task: 'study_trial', word: jsPsych.timelineVariable('word'), study_position: jsPsych.timelineVariable('position') }
        };

        const test_stimulus = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: function() {
                return '<div class="stimulus-text">' + jsPsych.timelineVariable('word') + '</div>' +
                       '<p style="margin-top: 50px; font-size: 20px; color: #555;">' + 
                       'Schon gesehen (<b>' + KEYS.old.toUpperCase() + '</b>) oder Neu (<b>' + KEYS.new.toUpperCase() + '</b>)?</p>';
            },
            choices: [KEYS.old, KEYS.new],
            post_trial_gap: 500,
            data: {
                task: 'test_trial', word: jsPsych.timelineVariable('word'), condition: jsPsych.timelineVariable('condition'),
                correct_response: jsPsych.timelineVariable('correct_response'), study_position: jsPsych.timelineVariable('study_position')
            },
            on_finish: function(data) {
                data.correct = jsPsych.pluginAPI.compareKeys(data.response, data.correct_response);
            }
        };

        // 7. Blöcke und Instruktionen
        const welcome = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: `<h1>Willkommen!</h1><p>Vielen Dank für dein Interesse an unserer Studie zum Thema Gedächtnis.</p><p>Das Experiment wird etwa 5 Minuten dauern.</p><p><i>Drücke eine beliebige Taste, um fortzufahren.</i></p>`
        };

        const consent = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: `<h2>Einverständniserklärung</h2><p>Deine Teilnahme an dieser Studie ist freiwillig. Du kannst jederzeit abbrechen.</p><p>Die Daten werden vollständig anonymisiert erhoben und sicher für wissenschaftliche Zwecke gespeichert.</p><p><b>Wenn du mit der Teilnahme einverstanden bist, drücke die LEERTASTE.</b></p>`,
            choices: [' ']
        };

        const demographics = {
            type: jsPsychSurveyHtmlForm,
            preamble: '<h3>Bitte beantworte noch diese kurzen Fragen zu deiner Person:</h3>',
            html: `
                <p>Alter: <input name="age" type="number" required min="1" max="99" style="width: 50px;"></p>
                <p>Geschlecht: 
                    <select name="gender" required>
                        <option value="" disabled selected>Bitte wählen...</option>
                        <option value="weiblich">Weiblich</option>
                        <option value="maennlich">Männlich</option>
                        <option value="divers">Divers</option>
                        <option value="keine_angabe">Keine Angabe</option>
                    </select>
                </p>
            `,
            button_label: 'Weiter'
        };

        const instructions_study = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: `<h2>Lernphase</h2><p>Es werden dir nun nacheinander 15 Wörter auf dem Bildschirm präsentiert.</p><p>Bitte präge dir diese Wörter so gut wie möglich ein.</p><p>Du musst in dieser Phase keine Tasten drücken.</p><p><i>Drücke eine beliebige Taste, um zu starten.</i></p>`,
            post_trial_gap: 1000
        };

        const study_block = {
            timeline: [fixation, study_stimulus], timeline_variables: studyTrials, randomize_order: false
        };

        const instructions_test = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: `<h2>Testphase</h2><p>Die Lernphase ist beendet.</p><p>Gleich siehst du eine Reihe von Wörtern. Einige davon hast du gerade gesehen ("Alte" Wörter), andere nicht ("Neue" Wörter).</p><p>Bitte entscheide so schnell und genau wie möglich:</p><p><b>JA</b> (altes Wort) = Taste <b>${KEYS.old.toUpperCase()}</b></p><p><b>NEIN</b> (neues Wort) = Taste <b>${KEYS.new.toUpperCase()}</b></p><p><i>Drücke eine beliebige Taste, um mit der Abfrage zu beginnen.</i></p>`,
            post_trial_gap: 1000
        };

        const test_block = {
            timeline: [fixation, test_stimulus], timeline_variables: testTrials, randomize_order: false 
        };

        const debriefing = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: `<h2>Vielen Dank für deine Teilnahme!</h2><p>In diesem Experiment haben wir untersucht, wie gut sich Menschen Wörter merken können,<br>abhängig davon, ob sie am Anfang, in der Mitte oder am Ende einer Liste präsentiert wurden <br>(Primacy- und Recency-Effekt).</p><p>Deine Daten wurden erfolgreich gespeichert.</p><p><i>Du kannst dieses Browserfenster nun schließen.</i></p>`,
            choices: "NO_KEYS"
        };

        // 8. Datenspeicherung via DataPipe
        const subject_id = jsPsych.randomization.randomID(8);
        jsPsych.data.addProperties({ subject: subject_id });
        const filename = `experiment_data_${subject_id}.csv`;

        const save_data = {
            type: jsPsychPipe,
            action: "save",
            experiment_id: "xYVpwn2Tows9", 
            filename: filename,
            data_string: () => jsPsych.data.get().csv()
        };

        // 9. Finale Timeline zusammenstellen und starten
        timeline.push(
            welcome, consent, demographics, instructions_study, study_block, 
            instructions_test, test_block, save_data, debriefing
        );

        jsPsych.run(timeline);
    </script>
</body>
</html>
